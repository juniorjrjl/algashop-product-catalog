server:
  port: 8083

spring:
  application:
    name: product-catalog
  mongodb:
    representation:
      uuid: standard
  data:
    mongodb:
      auto-index-creation: false #not use in production
algashop:
  data-load:
    enabled: false
    auto-delete: false
    sources:
      - location: db/testdata/categories.json
        collection: categories
      - location: db/testdata/products.json
        collection: products